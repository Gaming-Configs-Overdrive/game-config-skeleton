name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

jobs:
  release:
    if: github.repository != 'Gaming-Configs-Overdrive/game-config-skeleton'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Gaming-Configs-Overdrive/.github/.github/workflows/game-release.yml@v1
    with:
      installer-ref: v1
